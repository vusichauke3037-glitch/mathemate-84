<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathemate SA V5 - Tasks</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#2D6BFF;--green:#00C27A;--yellow:#FFD600;--bg:#F6F8FF;--red:#FF3B30}
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:var(--bg)}
header{background:var(--blue);color:#fff;padding:10px;text-align:center;position:sticky;top:0;z-index:10}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin:6px 0}
.btn{background:var(--blue);color:#fff;border:0;padding:8px 12px;border-radius:18px;font-weight:800;margin:2px;font-size:12px}
.btn-g{background:var(--green)} .btn-y{background:var(--yellow);color:#222} .btn-r{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:8px}
.class-card{border-left:6px solid var(--blue);cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:30;overflow:auto;padding:8px}
.modal-box{background:#fff;border-radius:14px;padding:12px;max-width:900px;margin:10px auto}
.term-input{width:52px;padding:8px;border-radius:8px;border:1px solid #ccc;text-align:center;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;gap:4px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse} th{background:var(--blue);color:#fff;padding:8px;font-size:11px} td{padding:4px;border:1px solid #ddd;font-size:12px}
.avg-high{color:var(--green);font-weight:900} .avg-low{color:var(--red);font-weight:900}
.task-card{border-left:6px solid var(--yellow);padding:8px;margin:4px 0;border-radius:8px;background:#fff8d6}
</style>
</head>
<body>
<header>
<input id="schoolName" placeholder="School Name" style="padding:10px;border-radius:8px;border:0;max-width:240px;width:70%">
<button class="btn btn-y" onclick="saveSchool()">Save School</button><br>
<div style="margin:6px 0"><input id="licenseInput" placeholder="MATHEMATE84-PRO-..." style="padding:8px;border-radius:8px;border:0;max-width:220px"><button class="btn btn-g" onclick="activateLicense()">Unlock</button> <span id="proBadge" style="background:#FFD600;color:#000;padding:3px 8px;border-radius:10px;font-size:11px">FREE</span></div>
<h3 style="margin:4px 0">MATHEMATE SA V5 - <span id="schoolLabel">My School</span> - TERM MARKS + TASKS</h3>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px">
<button class="btn btn-y" onclick="showTab('classes')">84 Classes</button>
<button class="btn" onclick="showTab('term')" style="background:#FFD600;color:#222">📊 Term Marks</button>
<button class="btn" onclick="showTab('tasks')">📚 CAPS Tasks</button>
<button class="btn" onclick="showTab('dash')">Principal Dash</button>
</div>
</header>

<div id="classesTab"><div style="padding:8px;font-size:13px"><b id="totalLearners">0</b> learners | <b id="avgAll">0%</b> final avg | <b id="promoRate">0% promoted</b> | <span id="termInfo">Term 1-4 capturing</span></div><div class="grid" id="classesGrid"></div></div>

<div id="termTab" style="display:none;padding:10px">
<h3>📊 Term Marks Capturing - <span id="termClassName">Select class</span></h3>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">
<button class="btn btn-y" onclick="setActiveTerm(1)">Term 1</button>
<button class="btn btn-y" onclick="setActiveTerm(2)">Term 2</button>
<button class="btn btn-y" onclick="setActiveTerm(3)">Term 3</button>
<button class="btn btn-y" onclick="setActiveTerm(4)">Term 4</button>
<button class="btn btn-g" onclick="setActiveTerm('final')">Final</button>
<span class="card" style="padding:6px 10px">Active: <b id="activeTermLabel">Term 1</b> | Quick type + Tab to next</span>
</div>
<div class="card" style="overflow:auto"><table id="termTable"><thead><tr><th>#</th><th>Learner</th><th>T1</th><th>T2</th><th>T3</th><th>T4</th><th>Final</th><th>Avg</th><th>DBE</th><th>WA</th></tr></thead><tbody id="termTableBody"></tbody></table></div>
<button class="btn btn-g" onclick="saveAllTerms()">💾 Save All Terms Offline</button> <button class="btn" onclick="whatsappTermReport()">WhatsApp Term Report</button>
</div>

<div id="tasksTab" style="display:none;padding:10px">
<h3>📚 CAPS Tasks - <span id="taskClassName">Select class</span></h3>
<div style="margin:8px 0"><button class="btn btn-y" onclick="addTask()">+ New Task (SA 104cm², 214cm²...)</button></div>
<div id="taskList"></div>
<div class="card"><h4>Task Bank (30 SA tasks)</h4>
<div id="taskBank"></div>
<button class="btn" onclick="importTaskBank()">Import SA Tasks</button>
</div>
</div>

<div id="dashTab" style="display:none;padding:10px"><div id="dashContent"></div><button class="btn btn-g" onclick="whatsappPrincipal()">WhatsApp Principal - Term Report</button></div>

<div id="classModal" class="modal"><div class="modal-box"><h3 id="modalTitle"></h3>
<div style="display:flex;gap:6px;margin:8px 0"><input id="newLearnerName" placeholder="Learner Full Name" style="flex:1"><button class="btn btn-g" onclick="addLearner()">Add 40 max</button><button class="btn btn-r" onclick="closeModal()">X</button></div>
<div id="modalLearners"></div>
</div></div>

 {id:3,term:2,grade:6,desc:"SA 345cm² Perimeter",ans:"78",xp:10}

 if(!desc) return;
 let ans=prompt("Correct answer:");
 if(!ans) return;
 let t=activeTerm==='final'?1:activeTerm, g=currentClass.split('')[0];
 tasks.push({id:Date.now(),term:t,grade:g,desc:desc,ans:ans,xp:10,created:new Date()});
 save(); renderTasks();
}
